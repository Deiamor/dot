# 4-validator fairspeed-dex testnet (single-host Docker Compose).
#
# Setup:
#   make docker-testnet-init   # build binary, init node dirs, generate .env
#   make docker-up             # build image and start all 4 containers
#
# Each container mounts the full .testnet/ directory so it can read sibling
# node IDs for peer discovery. Each node's home is /testnet/nodeN.
# Peers are passed via environment variables generated by gen-docker-env.sh.
version: "3.9"

x-node-defaults: &node-defaults
  image: fairspeed-dex:latest
  build:
    context: ..
    dockerfile: deployments/Dockerfile
  restart: unless-stopped
  networks:
    - fairspeed
  volumes:
    - ../.testnet:/testnet:rw

services:
  node0:
    <<: *node-defaults
    container_name: fairspeed-node0
    hostname: node0
    env_file: .env
    ports:
      - "8080:8080"    # REST API
      - "26656:26656"  # P2P (external access)
      - "26657:26657"  # RPC
    command:
      - start
      - -home
      - /testnet/node0
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE0_PEERS}"
      - -log-events
      - "true"

  node1:
    <<: *node-defaults
    container_name: fairspeed-node1
    hostname: node1
    env_file: .env
    ports:
      - "8081:8080"    # REST API
      - "26666:26656"  # P2P
    command:
      - start
      - -home
      - /testnet/node1
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE1_PEERS}"
      - -log-events
      - "true"

  node2:
    <<: *node-defaults
    container_name: fairspeed-node2
    hostname: node2
    env_file: .env
    ports:
      - "8082:8080"    # REST API
      - "26676:26656"  # P2P
    command:
      - start
      - -home
      - /testnet/node2
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE2_PEERS}"
      - -log-events
      - "true"

  node3:
    <<: *node-defaults
    container_name: fairspeed-node3
    hostname: node3
    env_file: .env
    ports:
      - "8083:8080"    # REST API
      - "26686:26656"  # P2P
    command:
      - start
      - -home
      - /testnet/node3
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE3_PEERS}"
      - -log-events
      - "true"

networks:
  fairspeed:
    driver: bridge
