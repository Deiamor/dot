# fairspeed-dex testnet — 4 validators + 1 read replica + 1 sequencer.
#
# Architecture:
#   node0-3    Validator nodes: participate in CometBFT consensus, no public API.
#   replica    Read-only full node: syncs all blocks, serves the REST API.
#              Clients query this node; it never votes.
#   sequencer  Transaction ingress: accepts WireTx on POST /tx, batches, and
#              broadcasts to validator mempools via broadcast_tx_async.
#              Clients submit orders to this node.
#
# Setup:
#   make docker-testnet-init   # build binary, init node dirs, generate .env
#   make docker-up             # build image and start all 6 containers
#
# Ports exposed to host:
#   8084  replica REST API  (orderbook queries, balance checks)
#   9090  sequencer ingress (order submission)
#   26656 node0 P2P         (for external validator connections)
version: "3.9"

x-node-defaults: &node-defaults
  image: fairspeed-dex:latest
  build:
    context: ..
    dockerfile: deployments/Dockerfile
  restart: unless-stopped
  networks:
    - fairspeed
  volumes:
    - ../.testnet:/testnet:rw

services:
  # ── Validators (consensus participants) ──────────────────────────────────
  node0:
    <<: *node-defaults
    container_name: fairspeed-node0
    hostname: node0
    env_file: .env
    ports:
      - "26656:26656"  # P2P (external access)
    command:
      - start
      - -home
      - /testnet/node0
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE0_PEERS}"
      - -log-events
      - "true"

  node1:
    <<: *node-defaults
    container_name: fairspeed-node1
    hostname: node1
    env_file: .env
    command:
      - start
      - -home
      - /testnet/node1
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE1_PEERS}"
      - -log-events
      - "true"

  node2:
    <<: *node-defaults
    container_name: fairspeed-node2
    hostname: node2
    env_file: .env
    command:
      - start
      - -home
      - /testnet/node2
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE2_PEERS}"
      - -log-events
      - "true"

  node3:
    <<: *node-defaults
    container_name: fairspeed-node3
    hostname: node3
    env_file: .env
    command:
      - start
      - -home
      - /testnet/node3
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${NODE3_PEERS}"
      - -log-events
      - "true"

  # ── Read Replica (non-voting full node, serves REST API) ──────────────────
  replica:
    <<: *node-defaults
    container_name: fairspeed-replica
    hostname: replica
    env_file: .env
    ports:
      - "8084:8080"    # REST API — the only public query endpoint
    depends_on:
      - node0
      - node1
      - node2
      - node3
    command:
      - start
      - -home
      - /testnet/replica
      - -addr
      - ":8080"
      - -p2p-port
      - "26656"
      - -peers
      - "${REPLICA_PEERS}"
      - -read-only
      - "true"
      - -log-events
      - "true"

  # ── Sequencer (transaction ingress, no consensus participation) ───────────
  sequencer:
    <<: *node-defaults
    container_name: fairspeed-sequencer
    hostname: sequencer
    env_file: .env
    ports:
      - "9090:9090"    # Transaction submission endpoint
    depends_on:
      - node0
      - node1
      - node2
      - node3
    command:
      - sequencer
      - -addr
      - ":9090"
      - -validators
      - "${SEQUENCER_VALIDATORS}"
      - -interval
      - "100ms"

networks:
  fairspeed:
    driver: bridge
