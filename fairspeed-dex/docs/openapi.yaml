openapi: 3.1.0
info:
  title: FairSpeed DEX API
  version: "1.0"
  description: |
    FairSpeed DEX — on-chain order-book perpetual futures exchange.
    All numeric amounts are int64 in the smallest unit of the asset
    (e.g. USDC with 6 decimals: 1_000_000 = 1.000000 USDC).
servers:
  - url: http://localhost:8080
    description: Local / testnet node

tags:
  - name: markets
    description: Market info and mark prices
  - name: orders
    description: Order submission and lifecycle
  - name: orderbook
    description: L2 order book
  - name: trades
    description: Executed trades
  - name: accounts
    description: Account management
  - name: balances
    description: Asset balances
  - name: positions
    description: PERP positions
  - name: funding
    description: Funding rate and index price
  - name: conditional
    description: Stop-loss / take-profit orders
  - name: points
    description: Testnet points and leaderboard
  - name: faucet
    description: Testnet token faucet
  - name: reports
    description: Compliance reports
  - name: infra
    description: Health and metrics

paths:
  /health:
    get:
      tags: [infra]
      summary: Node health check
      responses:
        "200":
          description: Node is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  height: { type: integer, example: 1234 }

  /metrics:
    get:
      tags: [infra]
      summary: Key node statistics
      responses:
        "200":
          description: Node metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  block_height:    { type: integer }
                  market_count:    { type: integer }
                  account_count:   { type: integer }
                  perp_markets:    { type: integer }
                  validator_count: { type: integer }

  /markets:
    get:
      tags: [markets]
      summary: List all markets
      responses:
        "200":
          description: Array of markets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Market' }

  /markprice/{marketId}:
    get:
      tags: [markets]
      summary: Current mark price for a market
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
          example: BTC-USDC-PERP
      responses:
        "200":
          description: Mark price
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkPriceResponse' }

  /markprice/{marketId}/history:
    get:
      tags: [markets]
      summary: Recent mark-price history (up to 500 points)
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Price history array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricePoint' }

  /orderbook/{marketId}:
    get:
      tags: [orderbook]
      summary: L2 order book snapshot
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderBook' }

  /trades/{marketId}:
    get:
      tags: [trades]
      summary: Recent executed trades for a market
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Array of trades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trade' }

  /orders:
    post:
      tags: [orders]
      summary: Submit a limit order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitOrderRequest' }
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{accountId}/history:
    get:
      tags: [orders]
      summary: Completed order history for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderHistoryItem' }

  /orders/{accountId}/open:
    get:
      tags: [orders]
      summary: Currently open orders for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Open orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderHistoryItem' }

  /accounts:
    post:
      tags: [accounts]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }

  /accounts/{accountId}:
    get:
      tags: [accounts]
      summary: Get account details
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }

  /sessions:
    post:
      tags: [accounts]
      summary: Create a trading session key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }

  /balances/{accountId}:
    get:
      tags: [balances]
      summary: Asset balances for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Balance' }

  /positions/{accountId}:
    get:
      tags: [positions]
      summary: Open PERP positions for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }

  /index-price:
    post:
      tags: [funding]
      summary: Submit a validator's CEX index price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitIndexPriceRequest' }
      responses:
        "200":
          description: Accepted

  /index-price/{marketId}:
    get:
      tags: [funding]
      summary: Current index price and per-validator submissions
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Index price
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexPriceResponse' }

  /conditional-orders:
    post:
      tags: [conditional]
      summary: Submit a stop-loss or take-profit order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitConditionalOrderRequest' }
      responses:
        "200":
          description: Conditional order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalOrderResponse' }

  /conditional-orders/{accountId}:
    get:
      tags: [conditional]
      summary: List conditional orders for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conditional orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConditionalOrderResponse' }

  /conditional-orders/{orderId}:
    delete:
      tags: [conditional]
      summary: Cancel a conditional order
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
        - in: query
          name: account_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled

  /points/{accountId}:
    get:
      tags: [points]
      summary: Points and FAIR token estimate for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Points info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointsResponse' }

  /points/leaderboard:
    get:
      tags: [points]
      summary: Top 100 points leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaderboardEntry' }

  /referral:
    post:
      tags: [points]
      summary: Register a referrer for an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:  { type: string }
                referrer_id: { type: string }
      responses:
        "200":
          description: Referral registered

  /faucet/{address}:
    get:
      tags: [faucet]
      summary: Request testnet tokens (1 request per 24 h per IP)
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - in: query
          name: asset
          schema: { type: string }
          description: Specific asset to drip; omit for all configured assets
      responses:
        "200":
          description: Tokens dripped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaucetResponse' }
        "429":
          description: Rate limited (cooldown active)

  /reports/trades:
    get:
      tags: [reports]
      summary: Compliance-grade trade report (all markets)
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trade' }

  /reports/kyc/{accountId}:
    get:
      tags: [reports]
      summary: KYC status for an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: KYC status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KYCStatusResponse' }

  /stream/orderbook:
    get:
      tags: [orderbook]
      summary: SSE stream — order book updates
      parameters:
        - in: query
          name: market
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream

  /stream/trades:
    get:
      tags: [trades]
      summary: SSE stream — trade executions
      parameters:
        - in: query
          name: market
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream

components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Market:
      type: object
      properties:
        market_id:        { type: string }
        type:             { type: string, enum: [SPOT, PERP] }
        status:           { type: string, enum: [ACTIVE, HALTED] }
        mark_price:       { type: integer, format: int64 }
        funding_rate_bps: { type: integer, format: int64 }

    MarkPriceResponse:
      type: object
      properties:
        market_id:        { type: string }
        mark_price:       { type: integer, format: int64 }
        funding_rate_bps: { type: integer, format: int64 }
        block_height:     { type: integer, format: int64 }

    PricePoint:
      type: object
      properties:
        time:         { type: integer, format: int64, description: Unix seconds }
        price:        { type: integer, format: int64 }
        block_height: { type: integer, format: int64 }

    OrderBook:
      type: object
      properties:
        market_id: { type: string }
        bids:
          type: array
          items: { $ref: '#/components/schemas/PriceLevel' }
        asks:
          type: array
          items: { $ref: '#/components/schemas/PriceLevel' }

    PriceLevel:
      type: object
      properties:
        price:    { type: integer, format: int64 }
        quantity: { type: integer, format: int64 }
        orders:   { type: integer }

    Trade:
      type: object
      properties:
        trade_id:       { type: string }
        market_id:      { type: string }
        maker_order_id: { type: string }
        taker_order_id: { type: string }
        price:          { type: integer, format: int64 }
        quantity:       { type: integer, format: int64 }
        maker_fee:      { type: integer, format: int64 }
        taker_fee:      { type: integer, format: int64 }
        block_height:   { type: integer, format: int64 }

    SubmitOrderRequest:
      type: object
      required: [account_id, session_id, market_id, side, price, quantity, time_in_force]
      properties:
        account_id:      { type: string }
        session_id:      { type: string }
        market_id:       { type: string }
        side:            { type: string, enum: [BUY, SELL] }
        price:           { type: integer, format: int64 }
        quantity:        { type: integer, format: int64 }
        time_in_force:   { type: string, enum: [GTC, IOC, FOK] }
        client_order_id: { type: string }

    OrderResponse:
      type: object
      properties:
        order_id:           { type: string }
        status:             { type: string }
        market_id:          { type: string }
        side:               { type: string }
        price:              { type: integer, format: int64 }
        quantity:           { type: integer, format: int64 }
        remaining_quantity: { type: integer, format: int64 }
        block_height:       { type: integer, format: int64 }
        trade_count:        { type: integer }

    OrderHistoryItem:
      type: object
      properties:
        order_id:            { type: string }
        market_id:           { type: string }
        side:                { type: string }
        price:               { type: integer, format: int64 }
        quantity:            { type: integer, format: int64 }
        remaining_quantity:  { type: integer, format: int64 }
        filled_quantity:     { type: integer, format: int64 }
        status:              { type: string, enum: [OPEN, PARTIAL, FILLED, CANCELLED, EXPIRED, REJECTED] }
        time_in_force:       { type: string }
        created_block_height:{ type: integer, format: int64 }
        client_order_id:     { type: string }

    CreateAccountRequest:
      type: object
      required: [owner_address]
      properties:
        owner_address:        { type: string }
        root_public_key:      { type: string }
        withdrawal_public_key:{ type: string }

    AccountResponse:
      type: object
      properties:
        account_id:       { type: string }
        owner_address:    { type: string }
        status:           { type: string }
        kyc_status:       { type: string }
        account_sequence: { type: integer }

    CreateSessionRequest:
      type: object
      required: [account_id]
      properties:
        account_id:          { type: string }
        allowed_markets:     { type: array, items: { type: string } }
        max_order_amount:    { type: integer, format: int64 }
        expire_after_blocks: { type: integer, format: int64 }

    SessionResponse:
      type: object
      properties:
        session_id:         { type: string }
        account_id:         { type: string }
        allowed_markets:    { type: array, items: { type: string } }
        session_public_key: { type: string }

    Balance:
      type: object
      properties:
        asset_id:  { type: string }
        available: { type: integer, format: int64 }
        reserved:  { type: integer, format: int64 }
        total:     { type: integer, format: int64 }

    Position:
      type: object
      properties:
        market_id:         { type: string }
        net_quantity:      { type: integer, format: int64 }
        avg_entry_price:   { type: integer, format: int64 }
        allocated_margin:  { type: integer, format: int64 }
        unrealized_pnl:    { type: integer, format: int64 }
        mark_price:        { type: integer, format: int64 }
        liquidation_price: { type: integer, format: int64 }
        side:              { type: string, enum: [LONG, SHORT, FLAT] }

    SubmitIndexPriceRequest:
      type: object
      required: [market_id, validator_id, price]
      properties:
        market_id:    { type: string }
        validator_id: { type: string }
        price:        { type: integer, format: int64 }
        source:       { type: string, description: "e.g. binance, okx, coinbase" }

    IndexPriceResponse:
      type: object
      properties:
        market_id:   { type: string }
        index_price: { type: integer, format: int64 }
        mark_price:  { type: integer, format: int64 }
        premium_bps: { type: integer, format: int64 }
        submissions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: validatorId → submitted price

    SubmitConditionalOrderRequest:
      type: object
      required: [account_id, session_id, market_id, side, order_type, quantity, trigger_price, trigger_condition]
      properties:
        account_id:          { type: string }
        session_id:          { type: string }
        market_id:           { type: string }
        side:                { type: string, enum: [BUY, SELL] }
        order_type:          { type: string, enum: [MARKET, LIMIT] }
        price:               { type: integer, format: int64 }
        quantity:            { type: integer, format: int64 }
        trigger_price:       { type: integer, format: int64 }
        trigger_condition:   { type: string, enum: [GTE, LTE] }
        reduce_only:         { type: boolean }
        expire_after_blocks: { type: integer, format: int64 }

    ConditionalOrderResponse:
      type: object
      properties:
        order_id:             { type: string }
        account_id:           { type: string }
        market_id:            { type: string }
        side:                 { type: string }
        order_type:           { type: string }
        price:                { type: integer, format: int64 }
        quantity:             { type: integer, format: int64 }
        trigger_price:        { type: integer, format: int64 }
        trigger_condition:    { type: string }
        reduce_only:          { type: boolean }
        status:               { type: string, enum: [OPEN, TRIGGERED, EXPIRED, CANCELLED] }
        expire_block_height:  { type: integer, format: int64 }
        created_block_height: { type: integer, format: int64 }

    PointsResponse:
      type: object
      properties:
        account_id:      { type: string }
        total_points:    { type: integer, format: int64 }
        trade_points:    { type: integer, format: int64 }
        referral_points: { type: integer, format: int64 }
        is_early_bird:   { type: boolean }
        fair_estimate:   { type: integer, format: int64 }

    LeaderboardEntry:
      type: object
      properties:
        rank:          { type: integer }
        account_id:    { type: string }
        total_points:  { type: integer, format: int64 }
        fair_estimate: { type: integer, format: int64 }

    FaucetResponse:
      type: object
      properties:
        address: { type: string }
        asset_id: { type: string }
        amount:   { type: integer, format: int64 }
        tx_id:    { type: string }
        status:   { type: string }

    KYCStatusResponse:
      type: object
      properties:
        account_id: { type: string }
        kyc_status: { type: string, enum: [PENDING, APPROVED, REVOKED, EXEMPT] }
